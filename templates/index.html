<!DOCTYPE html>
<html>
<head>
    <title>AI Wrinkle Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #fce4ec);
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            margin: 60px auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #d63384;
            margin-bottom: 30px;
            font-size: 24px;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #6c2b5f;
            text-align: left;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        button {
            background-color: #d63384;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c2185b;
        }

        /* Loading spinner styles */
        .spinner-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 229, 236, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #d63384;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        .spinner-text {
            color: #d63384;
            font-size: 16px;
            font-weight: bold;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 15px;
                padding: 25px;
            }
            h1 {
                font-size: 20px;
            }
            button {
                font-size: 15px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="spinner-overlay" id="spinner">
        <div class="spinner"></div>
        <div class="spinner-text">Processing your image... 💖</div>
    </div>

    <div class="container">
        <h1>AI Wrinkle Detector 💆‍♀️</h1>
        <form method="POST" enctype="multipart/form-data" onsubmit="showSpinner()">
            <label>Gender</label>
            <select name="gender" required>
                <option value="">-- Select Gender --</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>

            <label>Age Group</label>
            <select name="age" required>
                <option value="">-- Select Age Group --</option>
                <option value="13-19">13–19</option>
                <option value="20-29">20–29</option>
                <option value="30-39">30–39</option>
                <option value="40-49">40–49</option>
                <option value="50+">50+</option>
            </select>

            <label>Skin Type</label>
            <select name="skin_type" required>
                <option value="">-- Select Skin Type --</option>
                <option value="normal">Normal</option>
                <option value="dry">Dry</option>
                <option value="oily">Oily</option>
                <option value="combination">Combination</option>
                <option value="sensitive">Sensitive</option>
            </select>

            <label>Upload Skin Image</label>
            <input type="file" name="file" required>

            <button type="submit">Get Recommendation</button>
        </form>
    </div>

    <script>
        function showSpinner() {
            document.getElementById("spinner").style.display = "flex";
        }
    </script>

</body>
</html>
